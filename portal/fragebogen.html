:root{--ink:#0a0a0c;--ink2:#424245;--muted:#86868b;--paper:#f5f5f7;--line:rgba(0,0,0,.08);--violet:#8b5cf6;--grad:linear-gradient(100deg,#4f7cff 0%,#8b5cf6 52%,#ec4899 100%);--ease:cubic-bezier(.22,1,.36,1)}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:"Inter",system-ui,sans-serif;color:var(--ink);background:#fff;-webkit-font-smoothing:antialiased;line-height:1.5}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit;padding:0;-webkit-appearance:none;appearance:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
input,textarea{font:inherit;color:inherit}
/* ---------- Rahmen ---------- */
.top{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.88);backdrop-filter:blur(16px);border-bottom:1px solid var(--line)}
.top__in{max-width:1080px;margin:auto;display:flex;align-items:center;gap:18px;padding:13px 22px}
.brand{display:flex;align-items:center;gap:9px;font-weight:700;letter-spacing:-.02em;white-space:nowrap}
.brand svg{width:26px;height:26px}.brand span{font-weight:400;color:var(--muted)}
.prog{flex:1;height:5px;border-radius:5px;background:var(--paper);overflow:hidden}
.prog i{display:block;height:100%;width:0;background:var(--grad);border-radius:5px;transition:width .6s var(--ease)}
.stepno{font-size:13px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
main{max-width:1080px;margin:auto;padding:46px 22px 150px}
.step{animation:in .55s var(--ease)}
@keyframes in{from{opacity:0;transform:translateY(12px)}}
.eyebrow{display:inline-flex;align-items:center;gap:8px;margin:0 0 12px;font-size:13px;font-weight:600;letter-spacing:.02em;color:var(--ink2)}
.eyebrow b{display:inline-grid;place-items:center;min-width:26px;height:26px;padding:0 7px;border-radius:99px;background:var(--ink);color:#fff;font-size:12px}
h1{font-size:clamp(30px,4.4vw,48px);letter-spacing:-.045em;line-height:1.04;margin:0 0 12px;max-width:820px}
.lead{margin:0 0 8px;color:var(--ink2);font-size:17.5px;max-width:700px}
.why{display:flex;gap:10px;align-items:flex-start;margin:14px 0 30px;max-width:700px;padding:12px 14px;border-radius:14px;background:var(--paper);font-size:14px;color:var(--ink2)}
.why i{flex:none;width:20px;height:20px;border-radius:50%;background:var(--grad);color:#fff;font-style:normal;font-size:12px;font-weight:700;display:grid;place-items:center;margin-top:1px}
.hello{margin:0 0 8px;font-size:14px;font-weight:600;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;width:max-content}
/* ---------- Auswahlkarten ---------- */
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));grid-auto-rows:1fr}
.grid--2{grid-template-columns:repeat(2,minmax(0,1fr))}.grid--3{grid-template-columns:repeat(3,minmax(0,1fr))}.grid--4{grid-template-columns:repeat(4,minmax(0,1fr))}
.card{position:relative;display:flex;flex-direction:column;justify-content:flex-start;height:100%;width:100%;text-align:left;border-radius:22px;background:var(--paper);padding:12px 12px 16px;box-shadow:inset 0 0 0 2px transparent;transition:box-shadow .25s,transform .45s var(--ease),background .25s}
.card:hover{transform:translateY(-3px)}
.card:focus-visible,.chip:focus-visible,.yn button:focus-visible{outline:3px solid #a78bfa;outline-offset:2px}
.card.sel{background:#f5f3ff;box-shadow:inset 0 0 0 2px var(--violet)}
.card.sel::after{content:"✓";position:absolute;top:18px;right:18px;z-index:3;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--grad);color:#fff;font-size:14px;font-weight:700;box-shadow:0 6px 16px -4px rgba(139,92,246,.6)}
.card b{display:block;font-size:16.5px;letter-spacing:-.02em;margin:12px 4px 0}
.card small{display:block;color:var(--ink2);font-size:13.5px;margin:3px 4px 0;line-height:1.45}
.card--plain{padding:18px}
.card--plain b{margin:12px 0 0}.card--plain small{margin:3px 0 0}
.ico{width:46px;height:46px;border-radius:14px;background:var(--ink);color:#fff;display:grid;place-items:center}
.ico svg{width:22px;height:22px}
/* ---------- Laptop-Rahmen mit echter Mini-Seite (800×500, skaliert) ---------- */
.lap{border-radius:14px;background:#1d1d1f;padding:7px 7px 9px;box-shadow:0 18px 40px -22px rgba(0,0,0,.45)}
.lap__bar{display:flex;align-items:center;gap:5px;padding:0 4px 6px}
.lap__bar i{width:7px;height:7px;border-radius:50%;background:#48484c}
.lap__bar span{flex:1;margin-left:8px;height:13px;border-radius:5px;background:#2c2c2f;color:#8e8e93;font-size:8.5px;line-height:13px;text-align:center;overflow:hidden;white-space:nowrap}
.scr{position:relative;aspect-ratio:16/10;overflow:hidden;border-radius:5px;background:#fff}
.phone{width:min(170px,100%);margin:auto;border-radius:26px;background:#1d1d1f;padding:7px}
.phone .scr{aspect-ratio:9/18.5;border-radius:20px}
.pg{position:absolute;left:0;top:0;width:800px;height:500px;transform-origin:0 0;overflow:hidden}
.phone .pg{width:390px;height:802px}
/* Mini-Seiten: Farben/Schrift kommen als Variablen */
.pg{--bg:#ffffff;--surf:#f1f2f6;--fg:#15161a;--muted:#6b6f78;--acc:#4f5bd5;--acc2:#e05297;--on:#fff;--fh:"Inter",system-ui,sans-serif;--fb:"Inter",system-ui,sans-serif;--hw:800;--ls:-.04em;--tt:none;--r:14px;background:var(--bg);color:var(--fg);font-family:var(--fb)}
.m-nav{position:absolute;left:0;right:0;top:0;height:56px;display:flex;align-items:center;gap:26px;padding:0 34px;font-size:13px;z-index:4}
.m-nav b{font-family:var(--fh);font-size:17px;letter-spacing:var(--ls);margin-right:auto;font-weight:var(--hw);text-transform:var(--tt)}
.m-nav span{opacity:.75}
.m-btn{display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 20px;border-radius:calc(var(--r) * 2);background:var(--acc);color:var(--on);font-size:13.5px;font-weight:700}
.m-btn--line{background:transparent;color:inherit;box-shadow:inset 0 0 0 1.5px currentColor}
.m-h{font-family:var(--fh);font-weight:var(--hw);letter-spacing:var(--ls);line-height:.98;text-transform:var(--tt);margin:0}
.m-p{font-size:15px;line-height:1.5;color:var(--muted);margin:0}
.m-k{font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:var(--acc)}
.ph{position:relative;overflow:hidden;border-radius:var(--r);background:#c9d3dc}
.ph--a{background:radial-gradient(120% 70% at 70% 105%,#3d5a3a 0 35%,transparent 36%),radial-gradient(90% 60% at 15% 110%,#58784d 0 40%,transparent 41%),radial-gradient(60% 40% at 78% 28%,#fff5d8 0,#ffd9a0 18%,transparent 40%),linear-gradient(180deg,#8fb3d9 0%,#d7e3ea 55%,#e9e2cf 100%)}
.ph--b{background:radial-gradient(40% 55% at 78% 30%,rgba(255,240,210,.95),transparent 70%),linear-gradient(90deg,transparent 62%,rgba(255,255,255,.35) 62% 63%,transparent 63%),radial-gradient(70% 50% at 30% 100%,#6e4e3a 0 40%,transparent 41%),linear-gradient(160deg,#d9c3a5,#a7826a 60%,#5d4536)}
.ph--c{background:radial-gradient(30% 22% at 50% 74%,rgba(255,214,150,.95),transparent 70%),linear-gradient(180deg,transparent 70%,#2e3a4f 70.5%,#1f2838),linear-gradient(180deg,#f6b37f 0%,#e98a7a 40%,#8a6f9e 72%)}
.ph::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,.08),rgba(0,0,0,.08));mix-blend-mode:soft-light}
/* ---------- Chips, Felder, Ja/Nein ---------- */
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chip{padding:11px 17px;border-radius:999px;background:var(--paper);font-weight:600;font-size:14.5px;box-shadow:inset 0 0 0 2px transparent;transition:box-shadow .2s,background .2s}
.chip.sel{background:#f5f3ff;box-shadow:inset 0 0 0 2px var(--violet);color:#4c1d95}
h2{font-size:21px;letter-spacing:-.03em;margin:38px 0 12px}
label.f{display:grid;gap:7px;margin-bottom:18px;font-weight:600;font-size:15px}
label.f span{font-weight:400;color:var(--muted);font-size:13.5px}
.inp{width:100%;border:0;border-radius:14px;background:var(--paper);padding:14px 16px;font-size:16px;outline:none;box-shadow:inset 0 0 0 2px transparent;transition:box-shadow .2s}
.inp:focus{box-shadow:inset 0 0 0 2px var(--violet)}
textarea.inp{min-height:100px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:0 18px}
.consent{display:flex;gap:12px;align-items:flex-start;margin-top:16px;padding:14px 16px;border-radius:14px;background:#fff7ed;box-shadow:inset 0 0 0 1px #fed7aa;font-size:14px;cursor:pointer}
.consent input{width:20px;height:20px;margin:1px 0 0;accent-color:#8b5cf6;flex:none}
.yn{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.yn button{height:40px;border-radius:12px;background:#fff;font-weight:600;font-size:14px;box-shadow:inset 0 0 0 1.5px var(--line);transition:all .2s}
.yn button.yes.on{background:#ecfdf3;color:#166534;box-shadow:inset 0 0 0 2px #22c55e}
.yn button.no.on{background:#fef2f2;color:#991b1b;box-shadow:inset 0 0 0 2px #f87171}
.demo{background:var(--paper);border-radius:22px;padding:12px 12px 14px;display:flex;flex-direction:column;height:100%}
.demo .yn{margin-top:auto;padding-top:12px}
.demo b{display:block;font-size:15.5px;margin:12px 4px 0;letter-spacing:-.02em}
.demo small{display:block;color:var(--ink2);font-size:13px;margin:2px 4px 0}
.nomo{display:flex;align-items:center;justify-content:space-between;gap:14px;margin:0 0 20px;padding:14px 18px;border-radius:16px;background:var(--paper)}
.switch{position:relative;width:48px;height:28px;border-radius:99px;background:#d1d1d6;transition:background .25s;flex:none}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.2);transition:transform .3s var(--ease)}
.switch.on{background:#8b5cf6}.switch.on::after{transform:translateX(20px)}
.seg{display:inline-flex;padding:4px;border-radius:99px;background:var(--paper)}
.seg button{padding:9px 20px;border-radius:99px;font-weight:600;font-size:14.5px}
.seg button.on{background:var(--ink);color:#fff}
.sample{margin-top:14px;padding:16px 18px;border-radius:16px;background:var(--paper);font-size:15px}
.sample q{font-style:normal;font-weight:600}
.pal{display:flex;gap:6px;margin:12px 4px 0}
.lvl{margin:10px 4px 0;padding:10px 12px;border-radius:12px;background:#fff;font-size:13px;line-height:1.45;color:var(--ink2)}
.lvl b{display:inline;font-size:13px;margin:0;color:var(--ink)}
.fname{display:inline-block;margin:10px 4px 0;padding:3px 9px;border-radius:99px;background:#fff;font-size:12px;font-weight:600;color:var(--ink2)}
.pal i{width:22px;height:22px;border-radius:7px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.1)}
.brandin{display:none;gap:12px;align-items:center;margin-top:16px;padding:14px 16px;border-radius:14px;background:var(--paper);font-size:14.5px}
.brandin.on{display:flex}
.brandin input{width:54px;height:38px;border:0;padding:0;background:none;cursor:pointer}
.hint{font-size:13.5px;color:var(--muted)}
/* ---------- Fußleiste ---------- */
.bar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:rgba(255,255,255,.92);backdrop-filter:blur(16px);border-top:1px solid var(--line)}
.bar__in{max-width:1080px;margin:auto;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 22px}
.bar__mid{font-size:13.5px;color:var(--muted);text-align:center;flex:1}
.btn{display:inline-flex;align-items:center;gap:10px;height:50px;padding:0 24px;border-radius:999px;font-weight:600}
.btn--go{background:var(--ink);color:#fff}
.btn--go i{font-style:normal;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--grad)}
.btn--go:disabled{opacity:.35;cursor:not-allowed}
.btn--back{color:var(--ink2)}
.acc{max-width:520px;margin:10px auto 0;padding:30px;border-radius:26px;background:var(--paper)}
.acc h1{font-size:clamp(28px,4vw,38px)}
.acc .inp{background:#fff}
.acc__mail{display:flex;align-items:center;gap:10px;margin:0 0 18px;padding:12px 14px;border-radius:14px;background:#fff;font-size:15px}
.acc__mail span{color:var(--muted);font-size:13px}
.acc__perks{display:grid;gap:8px;margin:0 0 22px;padding:0;list-style:none;font-size:14.5px;color:var(--ink2)}
.acc__perks li{display:flex;gap:10px}.acc__perks li::before{content:"✓";flex:none;width:20px;height:20px;border-radius:50%;background:var(--grad);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center}
.acc .btn--go{width:100%;justify-content:center;margin-top:8px}
.acc .consent{background:#fff;box-shadow:inset 0 0 0 1px var(--line);margin:4px 0 6px}
.acc__alt{margin:16px 0 0;text-align:center;font-size:13.5px;color:var(--muted)}.acc__alt a{color:var(--ink2)}
.done{text-align:center;padding:50px 0}
.done__orb{width:120px;height:120px;margin:0 auto 26px;border-radius:50%;background:var(--grad);display:grid;place-items:center;color:#fff;font-size:46px;box-shadow:0 30px 60px -20px rgba(139,92,246,.7)}
.err{color:#c4314b;font-weight:600}
/* ---------- Animationen der Beispiele ---------- */
@keyframes blob1{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(160px,60px) scale(1.25)}}
@keyframes blob2{0%,100%{transform:translate(0,0) scale(1.1)}50%{transform:translate(-180px,-40px) scale(.9)}}
@keyframes marq{to{transform:translateX(-50%)}}
@keyframes fadeup{0%,8%{opacity:0;transform:translateY(26px)}22%,82%{opacity:1;transform:none}95%,100%{opacity:0;transform:none}}

@keyframes scrollbg{0%,12%{transform:translateY(0)}48%,60%{transform:translateY(-110px)}95%,100%{transform:translateY(0)}}

@keyframes lift1{0%,25%,48%,100%{transform:none;box-shadow:0 2px 6px rgba(0,0,0,.06)}30%,45%{transform:translateY(-14px) scale(1.03);box-shadow:0 22px 40px -14px rgba(0,0,0,.35)}}
@keyframes lift2{0%,55%,78%,100%{transform:none;box-shadow:0 2px 6px rgba(0,0,0,.06)}60%,75%{transform:translateY(-14px) scale(1.03);box-shadow:0 22px 40px -14px rgba(0,0,0,.35)}}
@keyframes word{0%,6%{opacity:0;transform:translateY(40px)}14%,84%{opacity:1;transform:none}94%,100%{opacity:0}}
@keyframes slide{0%,26%{transform:translateX(0)}33%,59%{transform:translateX(-33.333%)}66%,92%{transform:translateX(-66.666%)}100%{transform:translateX(0)}}
@keyframes dot{0%,26%{background:var(--acc);width:22px}33%,100%{background:rgba(255,255,255,.6);width:8px}}
@keyframes autoscroll{0%,8%{transform:translateY(0)}86%,100%{transform:translateY(var(--to))}}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(255,255,255,0)}50%{box-shadow:0 0 0 10px color-mix(in srgb,var(--acc) 25%,transparent)}}
@keyframes kenburns{from{transform:scale(1)}to{transform:scale(1.14) translate(-20px,-10px)}}
@keyframes tabs{0%,22%{transform:translateX(0)}25%,47%{transform:translateX(-25%)}50%,72%{transform:translateX(-50%)}75%,97%{transform:translateX(-75%)}100%{transform:translateX(0)}}
@keyframes tabmark{0%,22%{transform:translateX(0)}25%,47%{transform:translateX(100%)}50%,72%{transform:translateX(200%)}75%,97%{transform:translateX(300%)}100%{transform:translateX(0)}}
@media (prefers-reduced-motion:reduce){.pg *,.pg{animation-duration:0s!important;animation-iteration-count:1!important}}
@media (max-width:900px){.grid--4{grid-template-columns:repeat(2,minmax(0,1fr))}.grid--3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:620px){.grid--2,.grid--3,.grid--4{grid-template-columns:1fr}.two{grid-template-columns:1fr}main{padding-top:30px}.bar__mid{display:none}.top__in{gap:12px}.brand span{display:none}}
/* Kleine Handys: nichts ragt heraus, Knöpfe bleiben einzeilig und gut zu treffen */
.acc__mail{min-width:0}.acc__mail>*{min-width:0;overflow-wrap:anywhere}
.btn{white-space:nowrap}
@media (max-width:380px){main{padding-left:16px;padding-right:16px}.acc{padding:22px 18px}.bar__in{padding:12px 16px}.btn{padding:0 18px;gap:8px}.top__in{padding:12px 16px}.stepno{font-size:12px}.card.sel::after{top:12px;right:12px}.chip{padding:10px 14px}.seg button{padding:9px 14px}}
@media (hover:none){.card:hover{transform:none}}
</style>
</head>
<body>
<div class="top"><div class="top__in">
  <div class="brand"><svg viewBox="16.5 9 72 72" aria-hidden="true"><defs><linearGradient id="rm" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4f7cff"/><stop offset=".55" stop-color="#8b5cf6"/><stop offset="1" stop-color="#ec4899"/></linearGradient></defs><path d="M52 10C66 30 75 54 78 80H52Z" fill="url(#rm)"/><path d="M45 28C37 44 30 62 27 80H45Z" fill="#0a0a0c"/></svg>Reeder<span>Software</span></div>
  <div class="prog" aria-hidden="true"><i id="prog"></i></div><span class="stepno" id="stepno"></span>
</div></div>

<main id="app"><p id="loading">Einen Moment …</p></main>

  <span class="bar__mid" id="barmid"></span>

</div></div>

<script>
(() => {
  const token = (location.hash.match(/[a-f0-9]{48}/) || [])[0];
  const $ = (s, el = document) => el.querySelector(s), $$ = (s, el = document) => [...el.querySelectorAll(s)], app = $("#app");
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const A = { kind: null, company: "", branche: "", url: "", goal: "", audience: "", action: null, hero: null, density: null, structure: null, imagery: null, imgsrc: [], imgConsent: false,
    mode: null, palette: null, brand1: "#0f766e", brand2: "#f59e0b", typo: null, motionLevel: null, motion: {}, motionTouched: false, motionNone: false, tone: [], voice: "sie", features: [], likes: "", nogo: "", extra: "" };

      html: () => `<div class="grid grid--3">${["wenig", "mittel", "viel"].map(k => card("motionLevel", k, lap(LV[k](), vars()) + `<p class="lvl"><b>${LV_DESC[k][0]}.</b> ${LV_DESC[k][1]}</p>`, C().motionLevel[k], "")).join("")}</div>` },
    motion: { e: "Bewegung im Detail", t: "Welche Effekte genau?", l: () => `Passend zu Ihrer Auswahl „${esc(C().motionLevel[A.motionLevel] || "")}“ haben wir schon vorausgewählt. Ändern Sie, was Sie anders möchten.`, ok: () => true,
      why: "Was Sie mit „Gefällt mir“ markieren, kommt sicher vor – was Sie ablehnen, kommt auf keinen Fall vor.",
      html: () => `<div class="grid grid--3">${Object.keys(MO).map(k => `<div class="demo">${lap(MO[k](), vars())}<b>${esc(C().motion[k])}</b><small>${MO_DESC[k]}</small>
          <div class="yn"><button class="yes ${A.motion[k] === true ? "on" : ""}" data-mo="${k}" data-yn="1">Gefällt mir</button><button class="no ${A.motion[k] === false ? "on" : ""}" data-mo="${k}" data-yn="0">Lieber nicht</button></div></div>`).join("")}</div>` },
    tone: { e: "Sprache & Wirkung", t: "Wie sollen Sie wirken – und wie sprechen Sie Ihre Kunden an?", l: "Bis zu drei Begriffe.", ok: () => A.tone.length > 0,
      html: () => `<div class="chips">${Object.entries(C().tone).map(([k, v]) => `<button class="chip ${A.tone.includes(k) ? "sel" : ""}" data-m="tone" data-v="${k}">${esc(v)}</button>`).join("")}</div>
        <h2>Ansprache</h2><div class="seg">${Object.entries(C().voice).map(([k, v]) => `<button class="${A.voice === k ? "on" : ""}" data-voice="${k}">${v}</button>`).join("")}</div>
        <div class="sample">Beispiel: <q>${A.voice === "du" ? "Buch dir jetzt deinen Termin – wir freuen uns auf dich!" : "Buchen Sie jetzt Ihren Termin – wir freuen uns auf Sie!"}</q></div>` },
    features: { e: "Funktionen", t: "Was soll alles dabei sein?", l: "Wählen Sie, was Ihnen wichtig ist – das bauen wir im Entwurf bedienbar ein.", ok: () => true,
      html: () => { const list = A.kind === "ki" ? ["telefon", "chat", "termin", "faq", "sprachen"] : ["termin", "kontakt", "team", "leistungen", "shop", "login", "bewertungen", "galerie", "faq", "news", "anfahrt", "sprachen", "jobs", "newsletter"];
        return `<div class="chips">${list.map(k => `<button class="chip ${A.features.includes(k) ? "sel" : ""}" data-m="features" data-v="${k}">${esc(C().features[k])}</button>`).join("")}</div>`; } },
    notes: { e: "Zum Schluss", t: "Gibt es Vorbilder – oder etwas, das Sie auf keinen Fall möchten?", l: "Alles freiwillig. Gerade das „Auf keinen Fall“ hilft uns sehr.", ok: () => true,
      html: () => `<label class="f">Websites oder Marken, die Ihnen gefallen <span>Name oder Adresse – und gern, was Ihnen daran gefällt</span><textarea class="inp" data-in="likes" maxlength="600">${esc(A.likes)}</textarea></label>
        <label class="f">Was möchten Sie auf keinen Fall? <span>z. B. „keine Stockfotos mit Händeschütteln“, „nicht zu bunt“</span><textarea class="inp" data-in="nogo" maxlength="600">${esc(A.nogo)}</textarea></label>
        <label class="f">Sonst noch etwas?<textarea class="inp" data-in="extra" maxlength="1200">${esc(A.extra)}</textarea></label>` },
  };
  const plan = () => visual()
    ? ["kind", "about", "action", "hero", "density", "structure", "imagery", ...(["fotos", "illustration"].includes(A.imagery) || !A.imagery ? ["imgsrc"] : []), "mode", "palette", "typo", "motionLevel", "motion", "tone", "features", "notes"]
    : ["kind", "about", "action", "tone", "features", "notes"];

  /* ---------- Darstellung ---------- */
  function scaleAll() { $$(".scr").forEach(s => { const pg = s.firstElementChild; if (pg) pg.style.transform = `scale(${s.clientWidth / pg.offsetWidth})`; }); }
  const ro = new ResizeObserver(scaleAll);
  function counters() {
    timers.forEach(clearInterval); timers = [];
    $$(".cnt").forEach(el => { const n = +el.dataset.n, s = el.dataset.s; el._t = 0; el.textContent = "0" + s;
      timers.push(setInterval(() => { if (!el.closest(".scr")?.classList.contains("an")) return; el._t = (el._t + 1) % 90; const p = Math.min(1, el._t / 45), v = Math.round(n * (1 - Math.pow(1 - p, 3))); el.textContent = v.toLocaleString("de-DE") + s; }, 60)); });
  }
  /* Vorschauen laufen erst, wenn sie im Bild sind – und beginnen dann von vorn, etwas zügiger als vorher.
     Außerhalb des Bildes stehen sie still (spart Akku auf dem Handy). */
  const TEMPO = 1.4;
  const io = new IntersectionObserver(eintraege => { for (const e of eintraege) {
    const scr = e.target, anims = scr.getAnimations({ subtree: true });
    if (e.isIntersecting) { scr.classList.add("an"); scr.querySelectorAll(".cnt").forEach(c => { c._t = 0; });
      for (const a of anims) { try { a.currentTime = 0; a.playbackRate = TEMPO; a.play(); } catch {} } }
    else { scr.classList.remove("an"); for (const a of anims) { try { a.pause(); } catch {} } }
  } }, { threshold: .35 });
  function beobachten() {
    io.disconnect();
    for (const scr of $$(".scr")) { scr.classList.remove("an"); for (const a of scr.getAnimations({ subtree: true })) { try { a.pause(); a.currentTime = 0; } catch {} } io.observe(scr); }
  }
  function render(scroll) {
    steps = plan(); if (at >= steps.length) at = steps.length - 1;
    const k = steps[at], s = STEP[k];
    $("#prog").style.width = `${(at + 1) / steps.length * 100}%`; $("#stepno").textContent = `Frage ${at + 1} von ${steps.length}`;
    app.innerHTML = `${at === 0 ? `<p class="hello">Hallo ${esc(meta.name || "")}</p>` : ""}<section class="step"><p class="eyebrow"><b>${at + 1}</b>${esc(s.e)}</p><h1>${s.t}</h1><p class="lead">${typeof s.l === "function" ? s.l() : s.l}</p>${s.why ? `<p class="why"><i>i</i><span>${s.why}</span></p>` : `<div style="height:22px"></div>`}${s.html()}</section><p class="err" id="err" hidden></p>`;
    $("#back").style.visibility = at ? "visible" : "hidden";
    $("#next").innerHTML = at === steps.length - 1 ? "Absenden <i>→</i>" : "Weiter <i>→</i>";
    $("#barmid").textContent = at === steps.length - 1 ? "Danach bereiten wir Ihren Entwurf vor." : "";
    ro.disconnect(); $$(".scr").forEach(x => ro.observe(x)); scaleAll(); counters(); beobachten(); sync(); save();
    if (scroll) scrollTo({ top: 0, behavior: "instant" });
  }
  const sync = () => { $("#next").disabled = !STEP[steps[at]].ok(); };
  const rerenderKeepScroll = () => { const y = scrollY; render(); scrollTo({ top: y, behavior: "instant" }); };
  app.addEventListener("click", e => {
    const c = e.target.closest("[data-k]"); if (c) { A[c.dataset.k] = c.dataset.v;
      if (c.dataset.k === "motionLevel" && !A.motionTouched) { const D = { wenig: ["einblenden"], mittel: ["einblenden", "hover", "zaehler"], viel: ["einblenden", "hover", "zaehler", "parallax", "text", "hintergrund", "laufband", "slider"] }; A.motion = {}; for (const m of D[c.dataset.v]) A.motion[m] = true; }
      $$(`[data-k="${c.dataset.k}"]`, app).forEach(x => { x.classList.toggle("sel", x === c); x.setAttribute("aria-pressed", x === c); });
      if (c.dataset.k === "palette") $(".brandin", app)?.classList.toggle("on", c.dataset.v === "eigen");
      if (c.dataset.k === "kind" || c.dataset.k === "imagery") { steps = plan(); $("#stepno").textContent = `Frage ${at + 1} von ${steps.length}`; }
      sync(); save(); return; }
    const m = e.target.closest("[data-m]"); if (m) { const arr = A[m.dataset.m], v = m.dataset.v, i = arr.indexOf(v);
      if (i >= 0) arr.splice(i, 1); else if (m.dataset.m !== "tone" || arr.length < 3) arr.push(v);
      if (m.dataset.m === "imgsrc") return rerenderKeepScroll();
      m.classList.toggle("sel", arr.includes(v)); sync(); save(); return; }
    const y = e.target.closest("[data-mo]"); if (y) { const k = y.dataset.mo, val = y.dataset.yn === "1"; A.motion[k] = A.motion[k] === val ? undefined : val; A.motionTouched = true;
      $$(`[data-mo="${k}"]`, app).forEach(b => b.classList.toggle("on", A.motion[k] === (b.dataset.yn === "1"))); save(); return; }
    if (e.target.closest("[data-nomo]")) { A.motionNone = !A.motionNone; return rerenderKeepScroll(); }
    const vo = e.target.closest("[data-voice]"); if (vo) { A.voice = vo.dataset.voice; return rerenderKeepScroll(); }
  });
  app.addEventListener("input", e => { const i = e.target.closest("[data-in]"); if (!i) return; A[i.dataset.in] = i.value; if (i.type !== "color") { sync(); save(); } });
  app.addEventListener("change", e => {
    if (e.target.type === "color") return rerenderKeepScroll();
    const ch = e.target.closest("[data-chk]"); if (ch) { A[ch.dataset.chk] = ch.checked; sync(); save(); }
    if (e.target.dataset.in === "url" && steps[at] === "imgsrc") rerenderKeepScroll();
  });
  $("#back").addEventListener("click", () => { if (at) { at--; render(true); } });
  $("#next").addEventListener("click", async () => {
    if (at < steps.length - 1) { at++; render(true); return; }
    const b = $("#next"); b.disabled = true; b.textContent = "Wird gesendet …";
    try {
      const r = await fetch(`/api/vorab/${token}`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(A) });
      const d = await r.json().catch(() => ({}));
      if (r.status === 401) { meta.loggedIn = false; save(); return account(); }
      if (!r.ok) throw new Error(d.error || "Senden fehlgeschlagen");
      try { localStorage.removeItem(KEY); } catch {}
      done(d.building);
    } catch (err) { $("#err").textContent = err.message; $("#err").hidden = false; b.disabled = false; b.innerHTML = "Absenden <i>→</i>"; }
  });
  function account() {
    $("#bar").hidden = true; $("#prog").style.width = "0%"; $("#stepno").textContent = "";
    const neu = meta.account === "neu";
    app.innerHTML = `<p class="hello" style="margin-inline:auto">Hallo ${esc(meta.name || "")}</p><form class="acc" id="accForm" novalidate>
      <h1>${neu ? "Ihr persönlicher Bereich" : "Willkommen zurück"}</h1>
      <p class="lead" style="font-size:16px">${neu ? "Bevor es losgeht, legen Sie kurz Ihr Kundenkonto an – das dauert 20 Sekunden." : "Für diese E-Mail-Adresse gibt es schon ein Konto. Bitte melden Sie sich kurz an."}</p>
      ${neu ? `<ul class="acc__perks"><li>Ihre Angaben sind sicher gespeichert – Sie können jederzeit unterbrechen.</li><li>Nach dem Gespräch finden Sie dort Entwürfe, Termine und Unterlagen.</li><li>Kostenlos und unverbindlich.</li></ul>` : ""}
      <div class="acc__mail">✉︎ <b>${esc(meta.email || "")}</b> <span>(aus Ihrer Buchung)</span></div>
      <label class="f">Passwort${neu ? " <span>mindestens 10 Zeichen</span>" : ""}<input class="inp" type="password" id="pw1" autocomplete="${neu ? "new-password" : "current-password"}" required></label>
      ${neu ? `<label class="f">Passwort wiederholen<input class="inp" type="password" id="pw2" autocomplete="new-password" required></label>
        <label class="consent"><input type="checkbox" id="pc"><span>Ich habe die <a href="/datenschutz.html" target="_blank" rel="noopener">Datenschutzhinweise</a> gelesen. Meine Angaben werden zur Vorbereitung unseres Gesprächs verwendet.</span></label>` : ""}
      <p class="err" id="accErr" hidden></p>
      <button class="btn btn--go" type="submit">${neu ? "Konto anlegen & loslegen" : "Anmelden & weiter"} <i>→</i></button>
      ${neu ? "" : `<p class="acc__alt">Passwort vergessen? <a href="/portal/">Hier zurücksetzen</a></p>`}</form>`;
    $("#pw1").focus();
    $("#accForm").addEventListener("submit", async e => {
      e.preventDefault(); const err = $("#accErr"), b = $("button[type=submit]", e.target), pw = $("#pw1").value;
      const fail = m => { err.textContent = m; err.hidden = false; b.disabled = false; };
      if (neu && pw.length < 10) return fail("Das Passwort braucht mindestens 10 Zeichen.");
      if (neu && pw !== $("#pw2").value) return fail("Die beiden Passwörter stimmen nicht überein.");
      if (neu && !$("#pc").checked) return fail("Bitte bestätigen Sie die Datenschutzhinweise.");
      b.disabled = true; err.hidden = true;
      try {
        const r = await fetch(`/api/vorab/${token}/${neu ? "konto" : "anmelden"}`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ password: pw, consent: neu ? true : undefined }) });
        const d = await r.json().catch(() => ({}));
        if (r.status === 409) { meta.account = "vorhanden"; return account(); }
        if (!r.ok) return fail(d.error || "Das hat nicht geklappt.");
        meta.loggedIn = true; $("#bar").hidden = false; render(true);
      } catch { fail("Keine Verbindung – bitte erneut versuchen."); }
    });
  }
  function done(building) {
    timers.forEach(clearInterval); ro.disconnect();
    $("#bar").hidden = true; $("#prog").style.width = "100%"; $("#stepno").textContent = "";
    app.innerHTML = `<div class="done"><div class="done__orb">✓</div><h1 style="margin-inline:auto">Vielen Dank!</h1><p class="lead" style="margin:0 auto">${building ? "Wir bereiten aus Ihren Angaben einen ersten Entwurf vor und zeigen ihn Ihnen in unserem Gespräch." : "Ihre Angaben sind bei uns – so können wir uns gut auf unser Gespräch vorbereiten."}${meta.start ? `<br><br>Bis zum <b>${new Date(meta.start).toLocaleString("de-DE", { weekday: "long", day: "numeric", month: "long", hour: "2-digit", minute: "2-digit" })} Uhr</b>.` : ""}</p>
      <p style="margin-top:28px"><a class="btn btn--go" href="/portal/" style="text-decoration:none">Zu Ihrem Kundenportal <i>→</i></a></p></div>`;
  }
  (async () => {
    if (!token) { app.innerHTML = `<h1>Link unvollständig</h1><p class="lead">Bitte öffnen Sie den Link direkt aus unserer E-Mail.</p>`; return; }
    const r = await fetch(`/api/vorab/${token}`); const d = await r.json().catch(() => ({}));
    if (!r.ok) { app.innerHTML = `<h1>Link nicht gültig</h1><p class="lead">${esc(d.error || "")}</p>`; return; }
    meta = d; A.company = d.company || "";
    if (d.answered) { done(false); $("h1", app).textContent = "Ihre Angaben liegen uns schon vor."; return; }
    try { const s = JSON.parse(localStorage.getItem(KEY) || "null"); if (s?.A) { Object.assign(A, s.A); at = s.at || 0; } } catch {}
    if (!d.loggedIn) return account();
    $("#bar").hidden = false; render(true);
  })();
})();
</script>
</body>
</html>
